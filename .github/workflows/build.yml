name: ImmortalWrt Firmware Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device model (for example: x86_64, rpi4, ax3600)"
        required: true
        default: "x86_64"
        type: string
      branch:
        description: "ImmortalWrt branch (for example: master, openwrt-23.05)"
        required: true
        default: "master"
        type: string
      config_file:
        description: "Config file path relative to this repository"
        required: true
        default: "configs/x86_64_default.config"
        type: string

  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ inputs.device || 'x86_64' }}
    runs-on: ubuntu-latest

    env:
      DEVICE: ${{ inputs.device || 'x86_64' }}
      BRANCH: ${{ inputs.branch || 'master' }}
      CONFIG_FILE: ${{ inputs.config_file || 'configs/x86_64_default.config' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Build Environment
        shell: bash
        run: bash scripts/prepare.sh

      - name: Clone ImmortalWrt Source
        shell: bash
        run: |
          set -euo pipefail

          echo "Device: $DEVICE"
          echo "Branch: $BRANCH"
          echo "Config file: $CONFIG_FILE"

          git clone \
            --depth 1 \
            --single-branch \
            --branch "$BRANCH" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

      - name: Apply Config
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "::error::Config file does not exist: $CONFIG_FILE"
            find configs -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          cp "$CONFIG_FILE" immortalwrt/.config

          cd immortalwrt
          make defconfig

      - name: Build Firmware
        shell: bash
        run: bash scripts/build.sh

      - name: Collect Firmware
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d immortalwrt/bin/targets ]]; then
            echo "::error::Firmware output directory does not exist"
            exit 1
          fi

          mkdir -p output
          cp -a immortalwrt/bin/targets/. output/

          if ! find output -type f -print -quit | grep -q .; then
            echo "::error::No firmware files were found"
            exit 1
          fi

          (
            cd output
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 -r sha256sum
          ) > output/SHA256SUMS

          build_date="$(date -u +'%Y%m%d')"
          release_tag="firmware-${DEVICE}-${build_date}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          archive_name="immortalwrt-${DEVICE}-${build_date}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.tar.gz"

          tar -czf "$archive_name" -C output .
          sha256sum "$archive_name" > "${archive_name}.sha256"

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "date=$build_date" >> "$GITHUB_OUTPUT"
          echo "archive=$archive_name" >> "$GITHUB_OUTPUT"

          echo "Collected firmware files:"
          find output -type f -print

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware-${{ env.DEVICE }}-${{ github.sha }}
          path: output/**/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ImmortalWrt ${{ env.DEVICE }} ${{ steps.release.outputs.date }}
          generate_release_notes: true
          files: |
            ${{ steps.release.outputs.archive }}
            ${{ steps.release.outputs.archive }}.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
