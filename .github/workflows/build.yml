name: ImmortalWrt Firmware Build

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device model (for example: x86_64, rpi4, ax3600)"
        required: true
        default: "x86_64"
        type: string
      branch:
        description: "ImmortalWrt branch (for example: openwrt-25.12)"
        required: true
        default: "openwrt-25.12"
        type: string
      config_file:
        description: "Config file path relative to this repository"
        required: true
        default: "configs/x86_64_default.config"
        type: string

  schedule:
    - cron: "0 0 * * 0"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ inputs.device || 'x86_64' }}
    runs-on: ubuntu-latest

    env:
      DEVICE: ${{ inputs.device || 'x86_64' }}
      BRANCH: ${{ inputs.branch || 'openwrt-25.12' }}
      CONFIG_FILE: ${{ inputs.config_file || 'configs/x86_64_default.config' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Prepare Build Environment
        shell: bash
        run: bash scripts/prepare.sh

      - name: Clone ImmortalWrt Source
        shell: bash
        run: |
          set -euo pipefail

          echo "Device: $DEVICE"
          echo "Branch: $BRANCH"
          echo "Config file: $CONFIG_FILE"

          git clone \
            --depth 1 \
            --single-branch \
            --branch "$BRANCH" \
            https://github.com/immortalwrt/immortalwrt.git \
            immortalwrt

          echo "src-git nikki https://github.com/nikkinikki-org/OpenWrt-nikki.git;main" >> immortalwrt/feeds.conf.default
          echo "src-git adguardhome https://github.com/kenzok78/luci-app-adguardhome.git" >> immortalwrt/feeds.conf.default
          mkdir -p immortalwrt/files
          cp -a files/. immortalwrt/files/
          chmod +x immortalwrt/files/etc/uci-defaults/99-timezone

          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -p packages -a
          ./scripts/feeds install -p luci -a
          ./scripts/feeds install -p routing -a
          ./scripts/feeds install -p telephony -a
          ./scripts/feeds install -p video -a
          ./scripts/feeds install -p nikki nikki luci-app-nikki
          ./scripts/feeds install -p adguardhome luci-app-adguardhome

      - name: Apply Config
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -f "$CONFIG_FILE" ]]; then
            echo "::error::Config file does not exist: $CONFIG_FILE"
            find configs -maxdepth 2 -type f -print 2>/dev/null || true
            exit 1
          fi

          cp "$CONFIG_FILE" immortalwrt/.config

          cd immortalwrt
          make defconfig
          for package in nikki luci-app-nikki adguardhome luci-app-adguardhome; do
            grep -qx "CONFIG_PACKAGE_${package}=y" .config || { echo "::error::Missing package: $package"; exit 1; }
          done
          grep -qx 'CONFIG_TARGET_ROOTFS_PARTSIZE=1024' .config || { echo '::error::Root partition is not 1024 MiB'; exit 1; }

      - name: Build Firmware
        shell: bash
        run: bash scripts/build.sh

      - name: Collect Firmware
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -d immortalwrt/bin/targets ]]; then
            echo "::error::Firmware output directory does not exist"
            exit 1
          fi

          mkdir -p output
          cp -a immortalwrt/bin/targets/. output/

          immortwrt_version="${BRANCH#openwrt-}"
          immortwrt_version="${immortwrt_version//\//-}"
          printf 'ImmortalWrt branch: %s\nImmortalWrt version: %s\n' "$BRANCH" "$immortwrt_version" > output/IMMORTALWRT_VERSION

          if ! find output -type f -print -quit | grep -q .; then
            echo "::error::No firmware files were found"
            exit 1
          fi

          (
            cd output
            find . -type f ! -name SHA256SUMS -print0 \
              | sort -z \
              | xargs -0 -r sha256sum
          ) > output/SHA256SUMS

          build_date="$(date -u +'%Y%m%d')"
          release_tag="firmware-${immortwrt_version}-${DEVICE}-${build_date}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          archive_name="immortalwrt-${immortwrt_version}-${DEVICE}-${build_date}-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}.tar.gz"

          tar -czf "$archive_name" -C output .
          sha256sum "$archive_name" > "${archive_name}.sha256"

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "date=$build_date" >> "$GITHUB_OUTPUT"
          echo "archive=$archive_name" >> "$GITHUB_OUTPUT"

          echo "Collected firmware files:"
          find output -type f -print

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-firmware-${{ env.BRANCH }}-${{ env.DEVICE }}-${{ github.sha }}
          path: output/**/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: ImmortalWrt ${{ env.BRANCH }} ${{ env.DEVICE }} ${{ steps.release.outputs.date }}
          generate_release_notes: true
          files: |
            ${{ steps.release.outputs.archive }}
            ${{ steps.release.outputs.archive }}.sha256
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
